<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Equipamentos</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --danger: #dc2626;
            --bg: #f4f6f9;
            --card: #ffffff;
            --text: #1f2937;
            --muted: #6b7280;
            --border: #e5e7eb;
        }
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 0;
        }
        header {
            background: var(--primary);
            color: white;
            padding: 1.2rem 2rem;
        }
        header h1 { margin: 0; font-size: 1.4rem; }
        .container {
            max-width: 900px;
            margin: 2rem auto;
            padding: 0 1rem;
        }
        .card {
            background: var(--card);
            border-radius: 10px;
            border: 1px solid var(--border);
            padding: 1.5rem;
            box-shadow: 0 1px 2px rgba(0,0,0,0.04);
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            text-align: left;
            padding: 0.7rem 0.6rem;
            border-bottom: 1px solid var(--border);
            font-size: 0.92rem;
        }
        th { color: var(--muted); font-weight: 600; }
        .btn {
            display: inline-block;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            text-decoration: none;
            font-size: 0.9rem;
            border: none;
            cursor: pointer;
            font-family: inherit;
        }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-dark); }
        .btn-secondary { background: #e5e7eb; color: var(--text); }
        .btn-danger { background: var(--danger); color: white; }
        .actions { display: flex; gap: 0.4rem; }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.2rem;
        }
        .flash {
            padding: 0.7rem 1rem;
            border-radius: 6px;
            margin-bottom: 1rem;
            font-size: 0.9rem;
        }
        .flash.sucesso { background: #dcfce7; color: #166534; }
        .flash.erro { background: #fee2e2; color: #991b1b; }
        label {
            display: block;
            margin-bottom: 0.3rem;
            font-size: 0.85rem;
            color: var(--muted);
        }
        input, select {
            width: 100%;
            padding: 0.55rem 0.7rem;
            border: 1px solid var(--border);
            border-radius: 6px;
            margin-bottom: 1rem;
            font-size: 0.95rem;
            font-family: inherit;
        }
        .status-tag {
            padding: 0.2rem 0.6rem;
            border-radius: 999px;
            font-size: 0.78rem;
            font-weight: 600;
        }
        .status-ativo { background: #dcfce7; color: #166534; }
        .status-inativo { background: #f3f4f6; color: #4b5563; }
        .status-manutencao { background: #fef3c7; color: #92400e; }
        .empty { color: var(--muted); text-align: center; padding: 2rem 0; }
    </style>
</head>
<body>
    <header>
        <h1>🔧 Gestão de Equipamentos</h1>
    </header>
    <div class="container">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for categoria, msg in messages %}
                    <div class="flash {{ categoria }}">{{ msg }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        {% block content %}{% endblock %}
    </div>
</body>
</html>
